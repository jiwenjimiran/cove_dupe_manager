name: Build and Release Extension

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24.x'
  EXTENSION_PROJECT: src/DuplicateManager/DuplicateManager.csproj
  EXTENSION_ID: io.github.jiwenjimiran.duplicate-manager

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out Cove 1.1.0 build contracts
        uses: actions/checkout@v6
        with:
          repository: yourcove/cove
          ref: v1.1.0
          path: cove
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Test backend file cleanup
        run: dotnet run --project tests/DuplicateManager.RegressionTests/DuplicateManager.RegressionTests.csproj -c Release
      - name: Build extension
        run: dotnet build ${{ env.EXTENSION_PROJECT }} -c Release -p:UseLocalCovePlugins=true -p:CoveSourceRoot=${{ github.workspace }}/cove
      - name: Publish extension
        run: dotnet publish ${{ env.EXTENSION_PROJECT }} -c Release -o artifacts/extension --no-build -p:UseLocalCovePlugins=true -p:CoveSourceRoot=${{ github.workspace }}/cove
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=2.0.2" >> "$GITHUB_OUTPUT"
          fi
      - name: Package
        shell: bash
        run: |
          cd artifacts/extension
          zip -r ../../${{ env.EXTENSION_ID }}-${{ steps.version.outputs.value }}.zip .
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.EXTENSION_ID }}-${{ steps.version.outputs.value }}
          path: ${{ env.EXTENSION_ID }}-${{ steps.version.outputs.value }}.zip
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: '${{ env.EXTENSION_ID }}-*.zip'
          generate_release_notes: true
